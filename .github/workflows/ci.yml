name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  structure:
    name: Session structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node scripts/verify-sessions.mjs

  api:
    name: API boots and answers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: api/package-lock.json }
      - run: npm ci
        working-directory: api
      - name: Boot and smoke-test
        working-directory: api
        run: |
          node src/index.js &
          for i in $(seq 1 40); do curl -sf localhost:4000/api/dev/health >/dev/null && break; sleep 0.5; done
          curl -sf localhost:4000/api/dev/health | grep -q '"ok":true'
          curl -sf "localhost:4000/api/products?limit=5" | grep -q '"data"'
          test "$(curl -s -o /dev/null -w '%{http_code}' 'localhost:4000/api/products?_fail=422')" = 422
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:4000/api/admin/products)" = 401

  # Builds every app folder that exists — starters always, and solutions once
  # they have been released from the private companion repo after a session.
  apps:
    name: Build apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: typecheck, lint and build each app
        run: |
          set -e
          found=0
          for app in sessions/*/starter sessions/*/solution; do
            [ -f "$app/package.json" ] || continue
            found=$((found+1))
            echo "::group::$app"
            ( cd "$app" && npm install --no-audit --no-fund && npm run typecheck && npm run lint && npm run build )
            echo "::endgroup::"
          done
          echo "built $found app(s)"
          test "$found" -gt 0
